# ─────────────────────────────────────────────────────────────────────────────
# Nginx reverse proxy — incentivos-app
# Host (Ubuntu/Debian):
#   sudo apt install nginx certbot python3-certbot-nginx
#   sudo cp docker/nginx.conf /etc/nginx/sites-available/incentivos
#   sudo ln -s /etc/nginx/sites-available/incentivos /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d tudominio.com
# ─────────────────────────────────────────────────────────────────────────────

# ── Rate limiting zones ───────────────────────────────────────────────────────
# 10 MB shared zone = ~160.000 IPs tracked
limit_req_zone $binary_remote_addr zone=general:10m  rate=30r/m;
limit_req_zone $binary_remote_addr zone=auth:10m     rate=5r/m;   # login / register
limit_req_zone $binary_remote_addr zone=api:10m      rate=60r/m;  # API calls
limit_req_status 429;

# ── Redirect HTTP → HTTPS ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name tudominio.com;

    # Allow Let's Encrypt ACME challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS — proxy a Next.js ───────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name tudominio.com;

    # ── Certificados Let's Encrypt ────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tudominio.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── TLS hardening ─────────────────────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── Tamaño máximo de subida ───────────────────────────────────────────────
    client_max_body_size 5M;
    client_body_timeout  15s;
    client_header_timeout 15s;
    keepalive_timeout    65s;
    send_timeout         15s;

    # ── Security headers ─────────────────────────────────────────────────────
    # HSTS: browser caches HTTPS requirement for 1 year
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Hide nginx version from responses
    server_tokens off;

    # ── Block common attack paths ─────────────────────────────────────────────
    location ~* \.(php|asp|aspx|jsp|cgi|pl|sh|bash|env|git|svn)$ {
        deny all;
    }
    location ~* /\. {
        deny all; # block dotfiles (.env, .git, etc.)
    }
    location ~* /(wp-admin|wp-login|xmlrpc|phpmyadmin|admin\.php) {
        deny all; # block WordPress / CMS probing
    }

    # ── Auth endpoints — strict rate limit ───────────────────────────────────
    location ~* ^/api/auth/ {
        limit_req zone=auth burst=3 nodelay;
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── General API — moderate rate limit ────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Assets estáticos Next.js ──────────────────────────────────────────────
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000/_next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Todo lo demás ─────────────────────────────────────────────────────────
    location / {
        limit_req zone=general burst=10 nodelay;
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
