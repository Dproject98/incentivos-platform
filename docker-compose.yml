version: "3.9"

# ── Redes internas ────────────────────────────────────────────────────────────
# La red "backend" es privada: solo app <-> postgres.
# Postgres NO está expuesto al host (sin port mapping).
networks:
  backend:
    driver: bridge

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - backend
    environment:
      POSTGRES_DB: incentivos
      POSTGRES_USER: incentivos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Evita que postgres escuche en todas las interfaces (solo red interna)
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No exponemos el puerto 5432 al host — solo accesible desde la red "backend"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incentivos -d incentivos"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ── Next.js app ─────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - backend
    # Solo escucha en localhost del host — nginx en el host hace el proxy
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Base de datos — apunta al contenedor postgres en la red interna
      DATABASE_URL: postgresql://incentivos:${POSTGRES_PASSWORD}@postgres:5432/incentivos
      DIRECT_URL: postgresql://incentivos:${POSTGRES_PASSWORD}@postgres:5432/incentivos

      # Auth
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}

      # URL pública (usada en emails de QR)
      NEXT_PUBLIC_APP_URL: ${NEXTAUTH_URL}

      # Email (Resend)
      RESEND_API_KEY: ${RESEND_API_KEY}

      # WhatsApp — dejar vacío para deshabilitar
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}

      # Stripe
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

volumes:
  pgdata:
    driver: local
